name: ant_budget
description: "Ant Budget - AI powered expense tracking with on-device receipt OCR."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # --- State management (Presentation) ---------------------------------------
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # --- Navigation -----------------------------------------------------------
  go_router: ^18.0.2

  # --- Local persistence (Data) --------------------------------------------
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # Imported directly by the failure mapper to classify driver errors.
  sqlite3: ^3.5.2

  # --- On-device OCR + camera ----------------------------------------------
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  permission_handler: ^13.0.2

  # --- Domain helpers -------------------------------------------------------
  equatable: ^3.0.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Code generation ------------------------------------------------------
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1

  # --- Lints ----------------------------------------------------------------
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
